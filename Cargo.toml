[workspace]
resolver = "2"
# NOTE: inferno-control-gui is intentionally NOT a workspace member —
# it carries a path dep on fts-ui (sibling FastTrackStudio checkout),
# and a broken path dep in ANY member makes the whole workspace
# unloadable, which breaks `cargo add inferno-net --git …` for every
# consumer. The gui crate is its own standalone workspace; build it
# from its directory when the sibling checkout exists.
members = [
    "crates/inferno-net",
    "crates/inferno-control",
]
exclude = [
    "crates/inferno-control-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FastTrackStudios/inferno-control"
authors = ["Cody Wright"]

[workspace.dependencies]
inferno-net = { path = "crates/inferno-net" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
mdns-sd = "0.13"
bytes = "1"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"
rand = "0.9"
toml = "0.8"
socket2 = { version = "0.6", features = ["all"] }
# Cross-platform interface enumeration (name + ip + mac). Used to find
# the controller's host MAC for CMC + conmon probes.
network-interface = "2"

# (Dioxus + fts-ui deps moved into crates/inferno-control-gui — see the
# workspace-members note above.)
