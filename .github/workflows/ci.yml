name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone fts-ui (path-dep sibling of inferno-control-gui)
        run: git clone --depth 1 https://github.com/FastTrackStudios/fts-ui.git "$GITHUB_WORKSPACE/../../FastTrackStudio/fts-ui"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt --check (non-gui crates)
        run: cargo fmt -p inferno-net -p inferno-control -- --check

  clippy:
    name: clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [inferno-net, inferno-control]
    steps:
      - uses: actions/checkout@v4
      - name: clone fts-ui sibling
        run: git clone --depth 1 https://github.com/FastTrackStudios/fts-ui.git "$GITHUB_WORKSPACE/../../FastTrackStudio/fts-ui"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: clone fts-ui sibling
        run: git clone --depth 1 https://github.com/FastTrackStudios/fts-ui.git "$GITHUB_WORKSPACE/../../FastTrackStudio/fts-ui"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
      - run: cargo build -p inferno-net -p inferno-control --verbose
      - run: cargo test -p inferno-net -p inferno-control --verbose

  gui-build:
    name: gui build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone fts-ui sibling
        run: git clone --depth 1 https://github.com/FastTrackStudios/fts-ui.git "$GITHUB_WORKSPACE/../../FastTrackStudio/fts-ui"
      - name: install gui system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev \
            libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui
      - run: cargo build -p inferno-control-gui --verbose
        continue-on-error: true
